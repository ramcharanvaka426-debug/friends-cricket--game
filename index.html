
<!DOCTYPE html>
<html>
<head>
    <title>Friends Cricket Championship</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #123d24;
            color: white;
            text-align: center;
            font-family: Arial;
            padding: 25px;
        }

        h1 { color: gold; }

        .game-box {
            background: #205b35;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }

        input, button {
            padding: 12px;
            margin: 12px;
            border-radius: 8px;
        }

        button {
            background: gold;
            cursor: pointer;
            font-weight: bold;
        }

        img {
            max-width: 150px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>🏏 FRIENDS CRICKET CHAMPIONSHIP</h1>

    <div class="game-box">
        <h2>Player Registration</h2>

        <form id="registrationForm">

            <input
                type="text"
                id="playerName"
                placeholder="Enter your name"
                required
            >

            <br>

            <input
                type="file"
                id="photo"
                accept="image/jpeg,image/png,image/webp"
                required
            >

            <br>

            <img id="preview" hidden>

            <br>

            <button type="submit">JOIN MATCH</button>

        </form>

        <h3 id="message">Register to join the match!</h3>
        <hr>

<h2>🏏 Registered Players</h2>

<div id="playerList"></div>
    </div>

    <script>
        const form = document.getElementById("registrationForm");
        const message = document.getElementById("message");
        const photoInput = document.getElementById("photo");

        photoInput.addEventListener("change", function() {
            const file = this.files[0];

            if (file) {
                document.getElementById("preview").src =
                    URL.createObjectURL(file);

                document.getElementById("preview").hidden = false;
            }
        });

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("playerName").value.trim();
            const photo = photoInput.files[0];

            if (!name || !photo) {
                message.innerText = "Enter your name and select a photo!";
                return;
            }

            const data = new FormData();
            data.append("name", name);
            data.append("photo", photo);

            message.innerText = "Registering...";

            try {
                const response = await fetch("/register", {
                    method: "POST",
                    body: data
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || result.message || "Registration failed");
                }

                message.innerText =
                    "🎉 Welcome " + result.player.name +
                    "! Registration successful. Players: " +
                    result.total_players;

                form.reset();
                document.getElementById("preview").hidden = true;

            } catch (error) {
                message.innerText = "Error: " + error.message;
            }
        });
    </script>

</body>
</html>
