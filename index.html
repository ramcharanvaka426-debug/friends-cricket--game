
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friends Cricket Game</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #073b25;
            color: white;
            text-align: center;
        }

        header {
            background: #062b1b;
            padding: 25px;
        }

        h1 {
            color: #ffdb4d;
        }

        .container {
            max-width: 750px;
            margin: 25px auto;
            padding: 20px;
        }

        .panel {
            background: #105b37;
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
        }

        input {
            display: block;
            margin: 15px auto;
            padding: 12px;
            width: 85%;
            max-width: 350px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ffdb4d;
            color: #073b25;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: orange;
        }

        #message {
            color: #ffdb4d;
            font-weight: bold;
        }

        #playerList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .player-card {
            background: #073b25;
            width: 160px;
            padding: 15px;
            border-radius: 12px;
        }

        .player-card img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffdb4d;
        }

        .player-card h3 {
            overflow-wrap: anywhere;
        }

        footer {
            padding: 20px;
            color: #dddddd;
        }
    </style>
</head>

<body>

<header>
    <h1>🏏 FRIENDS CRICKET GAME 🏏</h1>
    <p>Register your player and join the match!</p>
</header>

<div class="container">

    <div class="panel">

        <h2>👤 Player Registration</h2>

        <form id="registrationForm">

            <input
                type="text"
                id="playerName"
                placeholder="Enter your name"
                required
            >

            <input
                type="file"
                id="playerPhoto"
                accept="image/jpeg,image/png,image/webp"
                required
            >

            <button type="submit">JOIN MATCH</button>

        </form>

        <h3 id="message">Register to join the match!</h3>

    </div>

    <div class="panel">

        <h2>🏏 Registered Players</h2>

        <h3>
            Total Players:
            <span id="playerCount">0</span>
        </h3>

        <div id="playerList">
            Loading players...
        </div>

    </div>

</div>

<footer>
    Friends Cricket Game | Play Together 🏆
</footer>

<script>

    // REGISTER PLAYER

    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const name = document.getElementById("playerName").value.trim();
        const photo = document.getElementById("playerPhoto").files[0];
        const message = document.getElementById("message");

        if (!name || !photo) {
            message.textContent = "Please enter your name and upload a photo.";
            return;
        }

        const formData = new FormData();

        formData.append("name", name);
        formData.append("photo", photo);

        message.textContent = "Registering...";

        try {

            const response = await fetch("/register", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || data.message || "Registration failed.");
            }

            message.textContent = data.message || "Registration successful!";

            if (data.player) {
                form.reset();
                await loadPlayers();
            }

        } catch(error) {

            message.textContent = "Error: " + error.message;

        }

    });


    // DISPLAY REGISTERED PLAYERS

    async function loadPlayers() {

        const playerList = document.getElementById("playerList");
        const playerCount = document.getElementById("playerCount");

        try {

            const response = await fetch("/players");

            if (!response.ok) {
                throw new Error("Could not load players.");
            }

            const data = await response.json();

            playerCount.textContent = data.total_players;

            playerList.replaceChildren();

            if (data.players.length === 0) {

                playerList.textContent = "No players registered yet.";

                return;
            }

            data.players.forEach(function(player) {

                const card = document.createElement("div");
                card.className = "player-card";

                const heading = document.createElement("h3");
                heading.textContent = player.name;

                const image = document.createElement("img");
                image.src = player.photo;
                image.alt = player.name;

                const type = document.createElement("p");
                type.textContent = player.type;

                card.appendChild(heading);
                card.appendChild(image);
                card.appendChild(type);

                playerList.appendChild(card);

            });

        } catch(error) {

            playerList.textContent = "Unable to load players. Please refresh.";

        }

    }


    // LOAD PLAYERS AND REFRESH EVERY 5 SECONDS

    loadPlayers();

    setInterval(loadPlayers, 5000);

</script>

</body>
</html>
