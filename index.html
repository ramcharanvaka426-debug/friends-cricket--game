<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Cricket - Player Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071b2c, #075b43);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #102d3d;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px #0008;
        }

        h1 {
            text-align: center;
            color: #54e39b;
        }

        p {
            text-align: center;
            color: #cbd5dc;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #58717e;
            background: #f4f7f8;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #28c779;
            color: #062a1b;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #preview {
            display: none;
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #54e39b;
            margin: 20px auto 0;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
        }

        a {
            color: #54e39b;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏏 Friends Cricket</h1>
        <p>Create your player profile and join the match!</p>

        <form id="registerForm">
            <label for="name">Enter your player name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
                maxlength="30"
            >

            <label for="photo">Upload your photo</label>
            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/png,image/jpeg,image/webp"
                required
            >

            <img id="preview" alt="Your photo preview">

            <button type="submit" id="submitButton">
                Register Player
            </button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const photoInput = document.getElementById("photo");
        const preview = document.getElementById("preview");
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        photoInput.addEventListener("change", function () {
            const file = this.files[0];

            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert("Please select a photo smaller than 5 MB.");
                this.value = "";
                preview.style.display = "none";
                return;
            }

            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        });

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const data = new FormData(form);

            button.disabled = true;
            button.textContent = "Registering...";
            message.textContent = "";

            try {
                const response = await fetch("/register", {
                    method: "POST",
                    body: data
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Registration failed.");
                }

                message.innerHTML =
                    "✅ Player registered successfully!<br><br>" +
                    '<a href="/game.html">Go to Cricket Ground →</a>';

            } catch (error) {
                message.textContent = "❌ " + error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Register Player";
            }
        });
    </script>
</body>
</html>
