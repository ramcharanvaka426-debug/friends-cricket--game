<!DOCTYPE html>
<html>
<head>
    <title>Friends Cricket Ground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            background: #10251b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 { color: #ffd700; }

        .scoreboard {
            padding: 12px;
            background: #172f24;
            margin: 15px;
            border-radius: 12px;
        }

        .ground {
            position: relative;
            width: 90%;
            max-width: 750px;
            height: 480px;
            margin: 25px auto;
            border: 12px solid #d9c99a;
            border-radius: 50%;
            background: repeating-linear-gradient(
                90deg, #16833c, #16833c 35px, #197d39 35px, #197d39 70px
            );
            box-sizing: border-box;
        }

        .pitch {
            position: absolute;
            width: 65px;
            height: 180px;
            background: #c9a16b;
            border: 3px solid #fff0c5;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .player {
            position: absolute;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            width: 65px;
        }

        .player img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            background: white;
        }

        .bot img {
            border-color: #ffcc00;
        }

        .player span {
            display: block;
            background: #092b17;
            padding: 3px;
            border-radius: 5px;
        }

        button {
            padding: 12px 25px;
            background: #ffd700;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>🏏 FRIENDS CRICKET GROUND</h1>

<div class="scoreboard">
    <h2>TEAM A 🟢 vs TEAM B 🔵</h2>
    <h3 id="playerCount">Loading players...</h3>
    <p>11 players per team | Humans + Bots</p>
</div>

<div class="ground">
    <div class="pitch"></div>
    <div id="players"></div>
</div>

<button onclick="loadPlayers()">REFRESH PLAYERS</button>

<script>
async function loadPlayers() {
    const area = document.getElementById("players");
    area.replaceChildren();

    try {
        const response = await fetch("/players");
        if (!response.ok) throw new Error("Could not load players");

        const data = await response.json();
        const humans = data.players || [];

        document.getElementById("playerCount").textContent =
            "Registered humans: " + humans.length + " / 11";

        const positions = [
            [50, 12], [75, 18], [88, 35], [88, 65],
            [75, 82], [50, 88], [25, 82], [12, 65],
            [12, 35], [25, 18], [50, 35]
        ];

        for (let i = 0; i < 22; i++) {
            const teamA = i < 11;
            const player = teamA ? humans[i] : null;
            const pos = positions[i % 11];

            const card = document.createElement("div");
            card.className = "player" + (player ? "" : " bot");
            card.style.left = pos[0] + "%";
            card.style.top = pos[1] + "%";

            const photo = document.createElement("img");
            photo.src = player ? player.photo : "https://placehold.co/80x80/555/fff?text=BOT";
            photo.alt = player ? player.name : "Bot";

            const name = document.createElement("span");
            name.textContent = player
                ? player.name
                : "Bot " + (teamA ? i + 1 : i - 10);

            card.append(photo, name);
            area.appendChild(card);
        }
    } catch (error) {
        document.getElementById("playerCount").textContent =
            "Could not load players. Please refresh.";
    }
}

loadPlayers();
</script>

</body>
</html>
