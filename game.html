
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends Cricket Stadium</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #10251b;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: gold;
    padding: 12px;
}

.scoreboard {
    background: #193c2b;
    margin: 12px;
    padding: 15px;
    border-radius: 12px;
}

.ground {
    position: relative;
    width: 95%;
    max-width: 950px;
    height: 560px;
    margin: 25px auto;
    border: 12px solid #d8c18b;
    border-radius: 50%;
    background: repeating-linear-gradient(
        90deg,
        #16833c 0px,
        #16833c 40px,
        #197b38 40px,
        #197b38 80px
    );
    overflow: hidden;
}

.pitch {
    position: absolute;
    width: 75px;
    height: 180px;
    background: #c9a16b;
    border: 3px solid white;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.player {
    position: absolute;
    width: 90px;
    transform: translate(-50%, -50%);
    z-index: 5;
}

.player img {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    object-fit: cover;
    background: white;
    display: block;
    margin: auto;
}

.human img {
    border: 5px solid #00ff80;
    box-shadow: 0 0 15px #00ff80;
}

.bot img {
    border: 4px solid gold;
}

.player-name {
    display: block;
    margin-top: 3px;
    background: #071c11;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 5px;
    border-radius: 7px;
    overflow-wrap: anywhere;
}

.human .player-name {
    background: #005d32;
    border: 2px solid #00ff80;
    color: white;
}

#status {
    color: gold;
    padding: 10px;
}

button {
    padding: 13px 25px;
    background: gold;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin: 15px;
}

@media(max-width: 600px) {
    .ground {
        height: 440px;
        width: 98%;
    }

    .player {
        width: 65px;
    }

    .player img {
        width: 45px;
        height: 45px;
    }

    .player-name {
        font-size: 10px;
        padding: 3px;
    }
}
</style>
</head>

<body>

<h1>🏏 FRIENDS CRICKET STADIUM 🏏</h1>

<div class="scoreboard">
    <h2>TEAM A 🟢 VS TEAM B 🔵</h2>
    <h3 id="playerCount">Loading players...</h3>
    <p>11 Players Per Team</p>
</div>

<div class="ground">
    <div class="pitch"></div>
    <div id="teamA"></div>
    <div id="teamB"></div>
</div>

<h3 id="status">Connecting to server...</h3>

<button onclick="loadPlayers()">🔄 REFRESH PLAYERS</button>

<script>
const positionsA = [
    [50, 12], [75, 20], [87, 40],
    [85, 68], [70, 85], [50, 90],
    [28, 85], [13, 68], [12, 40],
    [27, 20], [50, 35]
];

const positionsB = [
    [43, 45], [57, 45], [43, 55],
    [57, 55], [35, 35], [65, 35],
    [35, 65], [65, 65], [50, 25],
    [50, 75], [50, 50]
];

function createPlayer(player, index, position) {
    const card = document.createElement("div");

    const human = player !== null;

    card.className = human ? "player human" : "player bot";

    card.style.left = position[0] + "%";
    card.style.top = position[1] + "%";

    const img = document.createElement("img");

    if (human) {
        img.src = new URL(
            player.photo,
            window.location.origin
        ).href;

        img.alt = player.name;

        img.onerror = function() {
            img.src =
                "https://placehold.co/100x100/005d32/ffffff?text=HUMAN";
        };
    } else {
        img.src =
            "https://placehold.co/100x100/555555/ffffff?text=BOT";
        img.alt = "Bot";
    }

    const name = document.createElement("span");

    name.className = "player-name";

    name.textContent = human
        ? player.name
        : "Bot " + (index + 1);

    card.appendChild(img);
    card.appendChild(name);

    return card;
}

async function loadPlayers() {

    const teamA = document.getElementById("teamA");
    const teamB = document.getElementById("teamB");

    const status = document.getElementById("status");
    const count = document.getElementById("playerCount");

    status.textContent = "Loading players...";

    try {

        const response = await fetch(
            "/players?time=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        const data = await response.json();

        const humans = (data.players || [])
            .filter(p => p && p.name && p.photo)
            .slice(0, 11);

        teamA.replaceChildren();
        teamB.replaceChildren();

        // TEAM A: HUMANS FIRST, THEN BOTS

        for (let i = 0; i < 11; i++) {

            const player = humans[i] || null;

            const card = createPlayer(
                player,
                i,
                positionsA[i]
            );

            teamA.appendChild(card);
        }

        // TEAM B: 11 BOTS

        for (let i = 0; i < 11; i++) {

            const card = createPlayer(
                null,
                i,
                positionsB[i]
            );

            teamB.appendChild(card);
        }

        count.textContent =
            "Team A Humans: " + humans.length +
            " | Team A Bots: " + (11 - humans.length) +
            " | Team B Bots: 11";

        status.textContent = humans.length > 0
            ? "✅ Human players displayed successfully!"
            : "No registered human players found.";

    } catch (error) {

        status.textContent =
            "❌ Error loading players: " + error.message;

    }
}

loadPlayers();
</script>

</body>
</html>
