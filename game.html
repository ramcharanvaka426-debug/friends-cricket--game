
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Cricket 3D Stadium</title>
<style>
body { margin:0; overflow:hidden; background:#071b2c; font-family:Arial; }
#score {
 position:absolute; top:12px; left:12px; z-index:5;
 color:white; background:#102d3d; padding:12px;
 border-radius:10px; line-height:1.6;
}
#message {
 position:absolute; bottom:12px; left:12px; color:white;
 background:#102d3d; padding:10px; border-radius:8px;
}
</style>
<script type="importmap">
{
 "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>
</head>
<body>
<div id="score">🏏 Friends Cricket<br>Loading match...</div>
<div id="message">Loading players...</div>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
 60, window.innerWidth/window.innerHeight, 0.1, 1000
);
camera.position.set(0, 25, 38);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557755,2));

const sunlight = new THREE.DirectionalLight(0xffffff,2);
sunlight.position.set(10,30,15);
scene.add(sunlight);

// Cricket ground
const ground = new THREE.Mesh(
 new THREE.CircleGeometry(24,80),
 new THREE.MeshStandardMaterial({color:0x238b45})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

const boundary = new THREE.Mesh(
 new THREE.TorusGeometry(23.5,0.25,8,100),
 new THREE.MeshStandardMaterial({color:0xffffff})
);
boundary.rotation.x = Math.PI/2;
boundary.position.y = 0.1;
scene.add(boundary);

// Pitch
const pitch = new THREE.Mesh(
 new THREE.BoxGeometry(4,0.12,18),
 new THREE.MeshStandardMaterial({color:0xc8a477})
);
pitch.position.y = 0.08;
scene.add(pitch);

function createPlayer(name, x, z, shirtColor, photo=null) {
 const player = new THREE.Group();

 const shirt = new THREE.Mesh(
  new THREE.CylinderGeometry(0.55,0.7,1.5,16),
  new THREE.MeshStandardMaterial({color:shirtColor})
 );
 shirt.position.y = 1.65;
 player.add(shirt);

 const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.48,24,24),
  new THREE.MeshStandardMaterial({color:0xd9a078})
 );
 head.position.y = 2.75;
 player.add(head);

 // Photo displayed on the front of the 3D head
 if(photo) {
  const texture = new THREE.TextureLoader().load(photo);
  const face = new THREE.Mesh(
   new THREE.PlaneGeometry(0.65,0.72),
   new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true,
    side:THREE.DoubleSide
   })
  );
  face.position.set(0,2.76,0.43);
  player.add(face);
 }

 // Arms
 for(const side of [-1,1]) {
  const arm = new THREE.Mesh(
   new THREE.CylinderGeometry(0.16,0.16,1.15,12),
   new THREE.MeshStandardMaterial({color:shirtColor})
  );
  arm.position.set(side*0.72,1.65,0);
  arm.rotation.z = side*0.2;
  player.add(arm);

  const leg = new THREE.Mesh(
   new THREE.CylinderGeometry(0.19,0.2,1.25,12),
   new THREE.MeshStandardMaterial({color:0x222b35})
  );
  leg.position.set(side*0.28,0.62,0);
  player.add(leg);
 }

 // Player name
 const canvas = document.createElement('canvas');
 canvas.width=512;
 canvas.height=128;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='white';
 ctx.font='bold 48px Arial';
 ctx.textAlign='center';
 ctx.fillText(name,256,75);

 const labelTexture = new THREE.CanvasTexture(canvas);
 const label = new THREE.Sprite(
  new THREE.SpriteMaterial({map:labelTexture})
 );
 label.position.y=3.65;
 label.scale.set(3,0.75,1);
 player.add(label);

 player.position.set(x,0,z);
 scene.add(player);
 return player;
}

// Cricket positions
const teamBPositions = [
 [-8,-12],[-4,-17],[4,-17],[8,-12],
 [-13,-5],[13,-5],[-17,4],[17,4],
 [-10,9],[10,9],[0,13]
];

const teamAPositions = [
 [-1,-2],[1,2],[-5,0],[5,0],[-7,5],[7,5],
 [-9,-8],[9,-8],[-3,10],[3,10],[0,16]
];

async function loadPlayers() {
 try {
  const response = await fetch('/players');
  const data = await response.json();
  const players = data.players || [];

  // Team A: registered humans first, then bots
  for(let i=0;i<11;i++) {
   const human = players[i];
   const name = human ? human.name : 'Team A Bot '+(i+1);
   const photo = human ? human.photo : null;
   const pos = teamAPositions[i];
   createPlayer(name,pos[0],pos[1],0x1769d2,photo);
  }

  // Team B: bot placeholders
  for(let i=0;i<11;i++) {
   const pos = teamBPositions[i];
   createPlayer('Team B Bot '+(i+1),pos[0],pos[1],0xd52e35);
  }

  document.getElementById('message').textContent =
   players.length+' registered player(s) loaded.';

 } catch(error) {
  document.getElementById('message').textContent =
   'Could not load players: '+error.message;
 }
}

async function loadScore() {
 try {
  const response=await fetch('/match');
  const m=await response.json();
  document.getElementById('score').innerHTML =
   '🏏 Friends Cricket<br>'+
   'Batting: '+(m.batting_team || 'Not started')+'<br>'+
   'Score: '+(m.runs ?? 0)+' / '+(m.wickets ?? 0)+'<br>'+
   'Overs: '+(m.overs ?? 0)+'.'+(m.balls ?? 0);
 } catch(e) {
  document.getElementById('score').textContent='Friends Cricket';
 }
}

loadPlayers();
loadScore();

function animate() {
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
