
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends Cricket Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #10251b;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: gold;
    margin: 20px 5px;
}

.scoreboard {
    background: #193c2b;
    padding: 15px;
    margin: 12px;
    border-radius: 12px;
}

.ground {
    position: relative;
    width: 94%;
    max-width: 850px;
    height: 500px;
    margin: 25px auto;
    border: 12px solid #c9b47c;
    border-radius: 50%;
    background: repeating-linear-gradient(
        90deg,
        #16833c 0px,
        #16833c 40px,
        #197b38 40px,
        #197b38 80px
    );
    overflow: hidden;
}

.pitch {
    position: absolute;
    width: 65px;
    height: 175px;
    background: #c9a16b;
    border: 3px solid white;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.player {
    position: absolute;
    width: 75px;
    transform: translate(-50%, -50%);
    z-index: 2;
}

.player img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid white;
    background: white;
}

.player.human img {
    border-color: #00ffae;
}

.player.bot img {
    border-color: gold;
}

.player-name {
    display: block;
    background: #092b17;
    color: white;
    padding: 4px;
    border-radius: 5px;
    font-size: 11px;
    overflow-wrap: anywhere;
}

button {
    background: gold;
    color: black;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px;
}

#status {
    color: #ffd700;
    margin: 15px;
}

.legend {
    margin: 12px;
}
</style>
</head>

<body>

<h1>🏏 FRIENDS CRICKET GROUND 🏏</h1>

<div class="scoreboard">
    <h2>TEAM A 🟢 vs TEAM B 🔵</h2>
    <h3 id="playerCount">Loading players...</h3>
    <p>11 players in each team</p>
</div>

<div class="legend">
    🟢 Human Players &nbsp;&nbsp; 🟡 Bot Players
</div>

<div class="ground">
    <div class="pitch"></div>
    <div id="players"></div>
</div>

<h3 id="status">Connecting to server...</h3>

<button onclick="loadPlayers()">🔄 REFRESH PLAYERS</button>

<script>
const positions = [
    [50, 12],
    [75, 18],
    [88, 38],
    [88, 65],
    [75, 83],
    [50, 88],
    [25, 83],
    [12, 65],
    [12, 38],
    [25, 18],
    [50, 35]
];

function createPlayer(player, index, team) {
    const card = document.createElement("div");

    const isHuman = Boolean(player);

    card.className = "player " + (isHuman ? "human" : "bot");

    const pos = positions[index];

    card.style.left = pos[0] + "%";
    card.style.top = pos[1] + "%";

    const img = document.createElement("img");

    if (isHuman) {
        // Photo path is loaded from the same website.
        img.src = new URL(player.photo, window.location.origin).href;
        img.alt = player.name;

        img.onerror = function() {
            img.src = "https://placehold.co/80x80/16833c/ffffff?text=Human";
        };
    } else {
        img.src = "https://placehold.co/80x80/555555/ffffff?text=BOT";
        img.alt = "Bot player";
    }

    const name = document.createElement("span");
    name.className = "player-name";

    name.textContent = isHuman
        ? player.name
        : "Bot " + (index + 1);

    card.appendChild(img);
    card.appendChild(name);

    return card;
}

async function loadPlayers() {
    const area = document.getElementById("players");
    const status = document.getElementById("status");
    const count = document.getElementById("playerCount");

    status.textContent = "Loading registered players...";

    try {
        const response = await fetch("/players", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Server returned " + response.status);
        }

        const data = await response.json();

        // Only use valid registered human players.
        const humans = (data.players || [])
            .filter(p => p && p.name && p.photo)
            .slice(0, 11);

        area.replaceChildren();

        // Team A: registered humans first, then bots.
        for (let i = 0; i < 11; i++) {
            const player = humans[i] || null;
            area.appendChild(createPlayer(player, i, "A"));
        }

        // Team B: 11 bots.
        for (let i = 0; i < 11; i++) {
            area.appendChild(createPlayer(null, i, "B"));
        }

        count.textContent =
            "Team A Humans: " + humans.length +
            " | Team A Bots: " + (11 - humans.length) +
            " | Team B Bots: 11";

        status.textContent =
            humans.length > 0
            ? "✅ Registered human players loaded successfully!"
            : "No human players registered yet.";

    } catch (error) {
        status.textContent = "❌ Could not load players: " + error.message;
        count.textContent = "Player loading failed";
    }
}

loadPlayers();
</script>

</body>
</html>
